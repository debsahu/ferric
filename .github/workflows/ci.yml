name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-lint:
    name: Test, Lint & Benchmark Gate (CPU + WebGPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux GUI & Mesa Vulkan (Lavapipe) packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Activate stable Rust toolchain (clippy, rustfmt)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
          rustc -vV
          cargo -V

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-linux-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-linux-

      - name: Check formatting with rustfmt
        run: cargo fmt --all -- --check

      - name: Lint workspace with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A unknown_lints -A clippy::chunks_exact_to_as_chunks -A clippy::needless_range_loop

      - name: Run workspace release test suite (nmr-core + nmr-gpu parity)
        run: |
          RUSTFLAGS="-D warnings" cargo test --release -p nmr-core -p nmr-gui -p nmr-cli
          RUSTFLAGS="-D warnings" cargo test --release -p nmr-gpu -- --test-threads=1

      - name: Verify S1 golden 5c4e87d CPU & WebGPU U/P matrix snapshots
        run: cargo test --release -p nmr-gpu --test af_assign_gpu_tests

      - name: Verify S6 hostile binary & archive corpus gate (debug + release)
        run: |
          cargo test -p nmr-core --test spectrum_hostile_tests
          cargo test --release -p nmr-core --test spectrum_hostile_tests

      - name: Run Python brand, packager, preregistration, manual & payload-backed tour gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_ferric_brand.py --out-dir docs/assets/brand --self-test
          python3 scripts/render_ferric_brand_concepts.py --out-dir docs/assets/brand/concepts/previews --self-test
          python3 scripts/package_release.py --self-test
          python3 scripts/verify_p17_preregistration.py --self-test
          python3 scripts/verify_p17_preregistration.py --check
          python3 scripts/build_docs_manual.py --self-test
          python3 scripts/build_docs_manual.py --check
          python3 scripts/check_docs_cli_flags.py --self-test
          python3 scripts/check_docs_cli_flags.py --check
          python3 scripts/build_interactive_tours.py --self-test
          TOUR_CI_DIR="${RUNNER_TEMP:-/tmp}/ferric_ci_tours"
          rm -rf "$TOUR_CI_DIR"
          ./target/release/ferric export-tour --out-dir "$TOUR_CI_DIR" --module all
          python3 scripts/build_interactive_tours.py --data-dir "$TOUR_CI_DIR/data" --out "$TOUR_CI_DIR" --check
          rm -rf "$TOUR_CI_DIR"
          git diff --exit-code -- docs/assets/brand/

      - name: Realistic Bruker 5-Seed Benchmark Gate (standard >= 82% Acc / >= 90% HC Prec; evo-graph >= 95% Acc / >= 96% HC Prec)
        shell: bash
        run: |
          set -euo pipefail
          OUT_STD="$(CARGO_TERM_COLOR=never cargo run --release -p nmr-cli -- benchmark --star data/fixtures/synthetic_ubiquitin.str --realistic --seeds 5 --solver standard --engine cpu)"
          echo "=== standard (--realistic --seeds 5) ==="
          echo "$OUT_STD"
          OUT_EVO="$(CARGO_TERM_COLOR=never cargo run --release -p nmr-cli -- benchmark --star data/fixtures/synthetic_ubiquitin.str --realistic --seeds 5 --solver evo-graph)"
          echo "=== evo-graph (--realistic --seeds 5) ==="
          echo "$OUT_EVO"
          OUT_STD_TEXT="$OUT_STD" OUT_EVO_TEXT="$OUT_EVO" python3 - <<'PY'
          import os, re, sys

          def check_gate(label, out, min_acc, min_hcp):
              acc_m = re.search(r"accuracy\s*\(correct/assigned\)\s*:\s*([0-9]+(?:\.[0-9]+)?)%", out)
              hcp_m = re.search(r"high-confidence\s*\(>=0\.8\)\s*precision\s*:\s*([0-9]+(?:\.[0-9]+)?)%", out)
              if not acc_m or not hcp_m:
                  print(f"ERROR: failed to parse {label} benchmark metrics from nmr-cli output", file=sys.stderr)
                  sys.exit(1)
              acc = float(acc_m.group(1))
              hcp = float(hcp_m.group(1))
              print(f"Parsed {label} realistic 5-seed gate -> accuracy={acc:.1f}% (min {min_acc:.1f}%), hc_precision={hcp:.1f}% (min {min_hcp:.1f}%)")
              if acc < min_acc:
                  print(f"FAIL: {label} accuracy {acc:.1f}% regressed below {min_acc:.1f}% gate", file=sys.stderr)
                  sys.exit(1)
              if hcp < min_hcp:
                  print(f"FAIL: {label} high-confidence precision {hcp:.1f}% regressed below {min_hcp:.1f}% gate", file=sys.stderr)
                  sys.exit(1)

          check_gate("standard", os.environ["OUT_STD_TEXT"], 82.0, 90.0)
          check_gate("evo-graph", os.environ["OUT_EVO_TEXT"], 95.0, 96.0)
          PY

  test-debug:
    name: Workspace Debug Test Gate (Overflow & debug_assert Invariants)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux GUI & Mesa Vulkan (Lavapipe) packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            libwayland-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Activate stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -vV
          cargo -V

      - name: Cache Cargo registry & debug build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-linux-debug-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-linux-debug-

      - name: Run workspace debug test suite (overflow & epaint debug_assert checks)
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_DEV_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
          CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        run: |
          cargo test -p nmr-core -p nmr-gui -p nmr-cli
          cargo test -p nmr-gpu -- --test-threads=1

  wasm-check:
    name: WebAssembly + WebGPU GUI Check (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Activate stable Rust toolchain (wasm32-unknown-unknown)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable

      - name: Cache Cargo registry & WASM target artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-wasm32-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-wasm32-

      - name: Check nmr-gui for wasm32-unknown-unknown
        run: cargo check --release -p nmr-gui --target wasm32-unknown-unknown

  windows-check:
    name: Windows Cross-Target Check (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install MinGW-w64 cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Activate stable Rust toolchain (x86_64-pc-windows-gnu)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu --no-self-update
          rustup default stable

      - name: Cache Cargo registry & Windows GNU target artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ci-windows-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-windows-gnu-

      - name: Check nmr-cli & nmr-gui for x86_64-pc-windows-gnu (dev + release)
        run: |
          RUSTFLAGS="-D warnings" cargo check --locked -p nmr-cli -p nmr-gui --target x86_64-pc-windows-gnu
          RUSTFLAGS="-D warnings" cargo check --release --locked -p nmr-cli -p nmr-gui --target x86_64-pc-windows-gnu
