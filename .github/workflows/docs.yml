name: Documentation Manual & Live WebGPU Demo

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Static HTML Manual & wasm32 WebGPU Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies for wasm-bindgen-cli & tour video rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev ffmpeg

      - name: Install Rust stable toolchain with wasm32-unknown-unknown
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & wasm32 build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: docs-pages-wasm32

      - name: Build and verify multi-chapter HTML manual
        run: |
          python3 scripts/build_docs_manual.py --self-test
          python3 scripts/build_docs_manual.py --out "${{ runner.temp }}/pages_site" --check

      - name: Build wasm32 WebGPU browser demo bundle
        run: bash scripts/build_web_demo.sh --install-cli --out "${{ runner.temp }}/pages_site/demo"

      - name: Build and verify 8-module Interactive Video Tours
        run: |
          cargo build --release --locked -p nmr-cli --bin ferric
          ./target/release/ferric export-tour --out-dir "${{ runner.temp }}/pages_site/tours" --module all --render-videos
          python3 scripts/build_interactive_tours.py --data-dir "${{ runner.temp }}/pages_site/tours/data" --out "${{ runner.temp }}/pages_site/tours" --check
          test -f "${{ runner.temp }}/pages_site/tours/index.html"
          ls "${{ runner.temp }}/pages_site/tours/videos/"*.mp4 >/dev/null
          ls "${{ runner.temp }}/pages_site/tours/videos/"*.webm >/dev/null

      - name: Upload built manual & WebGPU demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferric-manual-and-web-demo
          path: ${{ runner.temp }}/pages_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Warn if GitHub Pages is not configured
        if: steps.configure_pages.outcome != 'success'
        run: echo "::warning::GitHub Pages is not enabled or configured for GitHub Actions; skipping live deployment (static bundle remains attached as workflow artifact ferric-manual-and-web-demo)."

      - name: Deploy artifact to GitHub Pages
        if: steps.configure_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
