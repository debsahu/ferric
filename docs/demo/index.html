<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e131b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FERRIC" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <title>FERRIC — Live WebGPU Browser Workbench Demo</title>
  <style>
    :root {
      --bg: #0e131b;
      --bar-bg: #141c27;
      --bar-border: #253347;
      --text: #dce7f5;
      --muted: #93a8c4;
      --accent: #5fd4ff;
      --ok-bg: rgba(46, 204, 113, 0.16);
      --ok-fg: #6ee7a8;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-fg: #fbbf24;
      --err-bg: rgba(239, 68, 68, 0.16);
      --err-fg: #fca5a5;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    html, body, #canvas-wrap, canvas#nmr_canvas {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    header.demo-bar {
      min-height: calc(28px + env(safe-area-inset-top, 0px));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: calc(10px + env(safe-area-inset-right, 0px));
      padding-bottom: 0;
      padding-left: calc(10px + env(safe-area-inset-left, 0px));
      background: #0f151e;
      border-bottom: 1px solid #1e293b;
      font-size: 11.5px;
      z-index: 20;
      position: relative;
      touch-action: manipulation;
    }
    .demo-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .demo-brand strong {
      color: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .preset-note {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 4px;
      border: 1px solid #253347;
      background: rgba(148, 163, 184, 0.08);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    @media (max-width: 820px) {
      .preset-note {
        display: none;
      }
    }
    .demo-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .cap-badge {
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
      background: rgba(95, 212, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(95, 212, 255, 0.25);
    }
    .cap-badge.ok {
      background: var(--ok-bg);
      color: var(--ok-fg);
      border-color: rgba(110, 231, 168, 0.28);
    }
    .cap-badge.warn {
      background: var(--warn-bg);
      color: var(--warn-fg);
      border-color: rgba(251, 191, 36, 0.30);
    }
    .cap-badge.err {
      background: var(--err-bg);
      color: var(--err-fg);
      border-color: rgba(252, 165, 165, 0.30);
    }
    a.manual-link {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 500;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #263449;
      background: rgba(255, 255, 255, 0.03);
      white-space: nowrap;
      touch-action: manipulation;
    }
    a.manual-link:hover {
      color: #ffffff;
      border-color: rgba(95, 212, 255, 0.38);
      background: rgba(95, 212, 255, 0.12);
    }
    a.manual-link.github-link {
      color: #cbd5e1;
      border-color: #263449;
      background: rgba(255, 255, 255, 0.03);
    }
    a.manual-link.github-link:hover {
      color: #ffffff;
      border-color: rgba(95, 212, 255, 0.38);
      background: rgba(95, 212, 255, 0.12);
    }
    #canvas-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: calc(100vh - 28px);
      height: calc(100dvh - 28px - env(safe-area-inset-top, 0px));
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      overflow: hidden;
    }
    canvas#nmr_canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #nmr_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      z-index: 10;
      text-align: center;
    }
    #fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      z-index: 15;
      touch-action: pan-y;
      -webkit-user-select: text;
      user-select: text;
    }
    #fallback[hidden] {
      display: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(95, 212, 255, 0.22);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-card {
      margin: auto 0;
      width: 100%;
      max-width: 600px;
      background: #151e2b;
      border: 1px solid var(--bar-border);
      border-radius: 10px;
      padding: 18px 20px;
      line-height: 1.55;
      font-size: 13.5px;
      color: var(--text);
      text-align: left;
    }
    .status-card h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #ffffff;
    }
    .status-card code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .status-card p {
      margin: 8px 0;
      color: var(--muted);
    }
    .status-card .hint-line {
      font-size: 12.5px;
      color: var(--text);
    }
    @media (max-width: 680px) {
      header.demo-bar {
        min-height: calc(28px + env(safe-area-inset-top, 0px));
        gap: 6px;
        padding-right: calc(8px + env(safe-area-inset-right, 0px));
        padding-left: calc(8px + env(safe-area-inset-left, 0px));
        font-size: 11px;
      }
      #canvas-wrap {
        height: calc(100vh - 28px);
        height: calc(100dvh - 28px - env(safe-area-inset-top, 0px));
      }
      .demo-brand {
        gap: 6px;
      }
      .demo-actions {
        gap: 5px;
      }
      .cap-badge {
        padding: 1px 6px;
        font-size: 10px;
      }
      a.manual-link {
        padding: 2px 7px;
        font-size: 11px;
      }
      .status-card {
        padding: 14px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="demo-bar">
    <div class="demo-brand">
      <img src="favicon.svg" alt="" width="18" height="18" style="border-radius:4px;flex-shrink:0" />
      <strong>FERRIC</strong>
      <span class="preset-note" title="Preloaded in-memory synthetic demonstration datasets (not cold empirical measurements)">Synthetic Ubiquitin Demo Suite &middot; In-Memory Synthetic 2D/3D, 1D, DOSY &amp; Metabolomics</span>
    </div>
    <div class="demo-actions">
      <span id="gpu_cap_badge" class="cap-badge">Checking GPU&hellip;</span>
      <a class="manual-link" href="../index.html">Manual</a>
      <a class="manual-link github-link" href="https://github.com/debsahu/ferric" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </header>

  <main id="canvas-wrap" class="canvas-stage">
    <div id="nmr_loading" role="status">
      <div id="nmr_spinner" class="spinner"></div>
      <div id="nmr_status_box" style="font-size: 14px; letter-spacing: 0.01em;">
        Initializing <strong>FERRIC</strong> WebAssembly + WebGPU Workbench&hellip;
      </div>
    </div>
    <div id="fallback" role="alert" hidden></div>
    <canvas id="nmr_canvas"></canvas>
  </main>

  <script type="module">
    const badgeEl = document.getElementById("gpu_cap_badge");
    const loadingEl = document.getElementById("nmr_loading");
    const fallbackEl = document.getElementById("fallback");

    function hasWebGL2() {
      try {
        const probe = document.createElement("canvas");
        return Boolean(probe.getContext("webgl2"));
      } catch (_) {
        return false;
      }
    }

    async function detectCapabilities() {
      const webgl2 = hasWebGL2();
      if (typeof navigator !== "undefined" && "gpu" in navigator && navigator.gpu) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            return { webgpu: true, webgl2, detail: "WebGPU Ready" };
          }
          return { webgpu: false, webgl2, detail: "No WebGPU" };
        } catch (_) {
          return { webgpu: false, webgl2, detail: "WebGPU Blocked" };
        }
      }
      return { webgpu: false, webgl2, detail: webgl2 ? "WebGL2 Only" : "No WebGPU" };
    }

    function showBanner(title, paragraphsHtml, badgeText, badgeClass) {
      if (badgeEl) {
        badgeEl.textContent = badgeText;
        badgeEl.className = "cap-badge " + badgeClass;
      }
      if (loadingEl) {
        loadingEl.style.display = "none";
      }
      if (fallbackEl) {
        fallbackEl.innerHTML =
          '<div class="status-card">' +
          "<h2>" + title + "</h2>" +
          paragraphsHtml +
          '<p style="margin-top:14px"><a class="manual-link" href="../index.html">&larr; Return to Documentation Manual</a></p>' +
          "</div>";
        fallbackEl.hidden = false;
      }
    }

    async function bootDemo() {
      const caps = await detectCapabilities();
      if (!caps.webgpu) {
        const glNote = caps.webgl2
          ? "Your browser supports <code>WebGL2</code>, whereas <code>FERRIC</code>'s zero-install GPU contour and 3D ribbon shaders use <code>WebGPU</code> (<code>navigator.gpu</code>)."
          : "Neither <code>WebGPU</code> (<code>navigator.gpu</code>) nor <code>WebGL2</code> could be initialized in this browser context.";
        showBanner(
          "WebGPU Adapter Required for Live Browser Workbench",
          "<p>" + glNote + "</p>" +
          '<p class="hint-line"><strong>iOS / iPadOS 18+ Safari:</strong> Settings &rarr; Apps &rarr; Safari &rarr; Advanced &rarr; Feature Flags &rarr; enable <code>WebGPU</code>.</p>' +
          '<p class="hint-line"><strong>Android 12+ Chrome 121+:</strong> Enabled by default on supported GPUs (or toggle <code>chrome://flags/#enable-unsafe-webgpu</code>).</p>' +
          '<p class="hint-line"><strong>Desktop:</strong> Chrome / Edge 113+, Safari 18+, or Firefox 130+ with hardware acceleration, or run <code>cargo run --release -p nmr-gui --bin ferric-gui</code>.</p>',
          caps.detail,
          caps.webgl2 ? "warn" : "err"
        );
        return;
      }

      if (badgeEl) {
        badgeEl.textContent = "WebGPU Ready";
        badgeEl.className = "cap-badge ok";
      }

      const bundlePath = "./ferric" + "_gui.js";
      try {
        const wasmModule = await import(bundlePath);
        if (typeof wasmModule.default === "function") {
          await wasmModule.default();
        }
      } catch (err) {
        const msg = err && err.message ? String(err.message) : String(err);
        showBanner(
          "WebAssembly Demo Bundle Not Found or Failed to Load",
          "<p>WebGPU is available in your browser, but <code>ferric_gui.js</code> / <code>ferric_gui_bg.wasm</code> has not been built into this directory yet.</p>" +
          "<p>Build the release <code>wasm32-unknown-unknown</code> bundle locally with:</p>" +
          "<p><code>bash scripts/build_web_demo.sh --out target/manual/demo</code></p>" +
          "<p style=\"font-size:12px\">Detail: <code>" + msg.replace(/[<>&]/g, "") + "</code></p>",
          "Bundle Missing",
          "warn"
        );
      }
    }

    if (loadingEl) {
      bootDemo();
    }
  </script>
</body>
</html>
